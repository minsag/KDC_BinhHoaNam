<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>huy_test - WebGIS</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
<script src="vendor/maplibre-gl/maplibre-gl.js"></script>
<link href="vendor/maplibre-gl/maplibre-gl.css" rel="stylesheet" />
<script src="vendor/leaflet/leaflet.js"></script>
<link href="vendor/leaflet/leaflet.css" rel="stylesheet" />
<style>
  body { margin: 0; padding: 0; }

  /* Lop nen DOM (Leaflet) - chi dung cho basemap Google, nam DUOI canvas MapLibre.
     Tile load qua the <img> thuong nen khong bi WebGL CORS/taint-check chan,
     nhung cung vi vay khong dung chung co che raster-source cua style.json. */
  #leaflet-base {
    position: absolute;
    top: 0; bottom: 0; left: 0; right: 0;
    width: 100%; height: 100%;
    z-index: 0;
    display: none;
    pointer-events: none;
  }
  #map {
    position: absolute;
    top: 0; bottom: 0; width: 100%; height: 100%;
    z-index: 1;
    background: transparent;
  }

  #google-attrib {
    position: absolute;
    bottom: 2px;
    right: 4px;
    z-index: 2;
    display: none;
    font: 10px/1.3 -apple-system, Segoe UI, Roboto, sans-serif;
    background: rgba(255,255,255,0.75);
    padding: 2px 6px;
    border-radius: 3px;
    color: #333;
    pointer-events: none;
  }

  #layer-control {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 3;
    background: rgba(255,255,255,0.94);
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    font: 13px/1.4 -apple-system, Segoe UI, Roboto, sans-serif;
    max-height: calc(100vh - 20px);
    overflow-y: auto;
  }
  #layer-control h4 {
    margin: 0;
    padding: 8px 12px 4px;
    font-size: 13px;
  }
  #layer-control h4.section-2 {
    padding-top: 8px;
    border-top: 1px solid rgba(0,0,0,0.1);
  }
  #layer-control .layer-list {
    padding: 2px 12px 8px;
  }
  #layer-control label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 0;
    cursor: pointer;
    white-space: nowrap;
  }
  #layer-control input {
    margin: 0;
  }
</style>
</head>
<body>
<div id="leaflet-base"></div>
<div id="map"></div>
<div id="google-attrib">© Google — endpoint nội bộ google.cn, không phải Maps Platform API chính thức, có thể ngừng hoạt động bất kỳ lúc nào</div>
<div id="layer-control">
  <h4>Bản đồ nền</h4>
  <div class="layer-list" id="basemap-list"></div>
  <h4 class="section-2">Lớp dữ liệu</h4>
  <div class="layer-list" id="layer-list"></div>
</div>
<script>
const ICONS = [
  ['cay_doc_lap', 'icons/cay_doc_lap@2x.png'],
  ['co_so_do_dac_DC', 'icons/co_so_do_dac_DC@2x.png'],
  ['co_so_do_dac_GPS', 'icons/co_so_do_dac_GPS@2x.png'],
  ['diem_do_cao', 'icons/diem_do_cao@2x.png']
];

// Ban do nen: chon 1 trong nhieu (radio).
// - esri-imagery / esri-topo / osm: nguon cong khai hop le, render qua raster
//   source chuan cua MapLibre (WebGL texture, can CORS - ca 3 deu co).
// - google-sat: dung endpoint noi bo google.cn/maps/vt, KHONG co header CORS
//   nen khong the load qua raster source WebGL binh thuong (bi chan boi chinh
//   trinh duyet, khong phai loi cau hinh). Giai phap: tai qua Leaflet (the
//   <img> DOM, khong bi WebGL taint-check) chay o mot lop rieng ben duoi
//   canvas MapLibre, dong bo pan/zoom bang tay - xem syncLeafletBase().
//   Van la endpoint khong chinh thuc, vi pham Dieu khoan dich vu Google
//   Maps/Earth khi dung ngoai trinh duyet Google Maps. Nguoi yeu cau da
//   duoc canh bao va CHAP NHAN RUI RO nay (2026-08-25) - hieu ro co the bi
//   Google chan/doi endpoint bat cu luc nao khong bao truoc.
const BASEMAPS = [
  { id: 'none', label: 'Không nền', layers: [] },
  { id: 'esri-imagery', label: 'Ảnh vệ tinh (Esri)', layers: ['basemap-esri-imagery'] },
  { id: 'esri-topo', label: 'Địa hình (Esri Topo)', layers: ['basemap-esri-topo'] },
  { id: 'osm', label: 'Bản đồ đường phố (OSM)', layers: ['basemap-osm'] },
  { id: 'google-sat', label: 'Ảnh vệ tinh (Google, không chính thức)', layers: [], dom: 'google' }
];
const ALL_BASEMAP_LAYERS = BASEMAPS.flatMap(b => b.layers);

// Nhom cac style-layer id theo tung lop du lieu goc (9 layer) de bat/tat dong thoi
const LAYER_GROUPS = [
  { label: 'Ranh khu đo',       layers: ['ranhKS-fill', 'ranhKS-line'] },
  { label: 'Dân cư / nhà',      layers: ['dancu-fill', 'dancu-outline'] },
  { label: 'Thủy văn',          layers: ['thuyvan-line'] },
  { label: 'Mép đường',         layers: ['mepduong-line'] },
  { label: 'Cầu giao thông',    layers: ['cau-casing', 'cau-fill'] },
  { label: 'Đường bình độ',     layers: ['binhdo-default', 'binhdo-cobanban', 'binhdo-nuakhoang', 'binhdo-phu', 'binhdo-nhap'] },
  { label: 'Cây độc lập',       layers: ['caydoclap-icon'] },
  { label: 'Cơ sở đo đạc',      layers: ['codo-default', 'codo-dc', 'codo-gps'] },
  { label: 'Điểm độ cao',       layers: ['diemdocao-icon', 'diemdocao-label'] }
];

const INITIAL_CENTER = [106.3504, 10.7874]; // centroid bbox du lieu thuc te (Long An)
const INITIAL_ZOOM = 15;

const map = new maplibregl.Map({
  container: 'map',
  style: 'style.json',
  center: INITIAL_CENTER,
  zoom: INITIAL_ZOOM,
  // Tat rotate/pitch: ban do dia chinh 2D, khong can xoay/nghieng, va Leaflet
  // (lop DOM cho basemap Google) khong ho tro rotate nen neu cho phep xoay
  // se lam 2 lop lech nhau.
  dragRotate: false,
  pitchWithRotate: false,
  touchPitch: false
});

// --- lop DOM (Leaflet) cho basemap Google, chi khoi tao/dieu khien khi can ---
const leafletBase = L.map('leaflet-base', {
  zoomControl: false,
  attributionControl: false,
  dragging: false,
  touchZoom: false,
  scrollWheelZoom: false,
  doubleClickZoom: false,
  boxZoom: false,
  keyboard: false,
  tap: false,
  zoomSnap: 0,
  zoomAnimation: false,
  fadeAnimation: false,
  inertia: false
}).setView([INITIAL_CENTER[1], INITIAL_CENTER[0]], INITIAL_ZOOM);

const googleTileLayer = L.tileLayer(
  'https://www.google.cn/maps/vt?lyrs=s@189&gl=cn&x={x}&y={y}&z={z}',
  { tileSize: 256, maxZoom: 20, attribution: '© Google' }
);

function syncLeafletBase() {
  const c = map.getCenter();
  leafletBase.setView([c.lat, c.lng], map.getZoom(), { animate: false });
}
map.on('move', syncLeafletBase);
map.on('resize', () => leafletBase.invalidateSize());

map.on('load', () => {
  ICONS.forEach(([name, url]) => {
    map.loadImage(url, (err, image) => {
      if (err) { console.error('Khong load duoc icon', name, err); return; }
      if (!map.hasImage(name)) map.addImage(name, image, { pixelRatio: 2 });
    });
  });

  // --- panel ban do nen (radio, chon 1) ---
  const basemapListEl = document.getElementById('basemap-list');
  const leafletBaseEl = document.getElementById('leaflet-base');
  const googleAttribEl = document.getElementById('google-attrib');

  BASEMAPS.forEach((basemap, i) => {
    const id = 'basemap-toggle-' + i;
    const wrapper = document.createElement('label');
    wrapper.setAttribute('for', id);

    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'basemap';
    radio.id = id;
    radio.checked = basemap.id === 'none';
    radio.addEventListener('change', () => {
      if (!radio.checked) return;

      ALL_BASEMAP_LAYERS.forEach((layerId) => {
        if (map.getLayer(layerId)) {
          const visible = basemap.layers.includes(layerId);
          map.setLayoutProperty(layerId, 'visibility', visible ? 'visible' : 'none');
        }
      });

      if (basemap.dom === 'google') {
        leafletBaseEl.style.display = 'block';
        googleAttribEl.style.display = 'block';
        if (!leafletBase.hasLayer(googleTileLayer)) googleTileLayer.addTo(leafletBase);
        map.setPaintProperty('background', 'background-opacity', 0);
        syncLeafletBase();
        // container vua duoc display:block, Leaflet can tinh lai kich thuoc
        setTimeout(() => leafletBase.invalidateSize(), 0);
      } else {
        leafletBaseEl.style.display = 'none';
        googleAttribEl.style.display = 'none';
        map.setPaintProperty('background', 'background-opacity', 1);
      }
    });

    wrapper.appendChild(radio);
    wrapper.appendChild(document.createTextNode(basemap.label));
    basemapListEl.appendChild(wrapper);
  });

  // --- panel lop du lieu (checkbox, doc lap) ---
  const listEl = document.getElementById('layer-list');
  LAYER_GROUPS.forEach((group, i) => {
    const id = 'layer-toggle-' + i;
    const wrapper = document.createElement('label');
    wrapper.setAttribute('for', id);

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = id;
    checkbox.checked = true;
    checkbox.addEventListener('change', () => {
      const visibility = checkbox.checked ? 'visible' : 'none';
      group.layers.forEach((layerId) => {
        if (map.getLayer(layerId)) {
          map.setLayoutProperty(layerId, 'visibility', visibility);
        }
      });
    });

    wrapper.appendChild(checkbox);
    wrapper.appendChild(document.createTextNode(group.label));
    listEl.appendChild(wrapper);
  });
});

map.addControl(new maplibregl.NavigationControl({ showCompass: false }));
map.addControl(new maplibregl.AttributionControl({ compact: true }));
</script>
</body>
</html>
