<style>

  #map { position: absolute; top: 0; bottom: 0; width: 100%; }

  #layer-control {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 1;
    background: rgba(255,255,255,0.94);
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    font: 13px/1.4 -apple-system, Segoe UI, Roboto, sans-serif;
    max-height: calc(100vh - 20px);
    overflow-y: auto;
    width: 220px;
  }
  #layer-control h4 {
    margin: 0;
    padding: 8px 12px 4px;
    font-size: 13px;
  }
  #layer-control h4.section-2 {
    padding-top: 8px;
    border-top: 1px solid rgba(0,0,0,0.1);
  }
  #layer-control .layer-list {
    padding: 2px 12px 8px;
  }
  #layer-control label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 0;
    cursor: pointer;
    white-space: nowrap;
  }
  #layer-control input {
    margin: 0;
  }

  #area-tabs {
    display: flex;
    border-top: 1px solid rgba(0,0,0,0.1);
    border-bottom: 1px solid rgba(0,0,0,0.1);
  }
  #area-tabs button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 8px 4px;
    font: 13px/1.2 -apple-system, Segoe UI, Roboto, sans-serif;
    cursor: pointer;
    color: #555;
    border-bottom: 2px solid transparent;
  }
  #area-tabs button.active {
    color: #1a73e8;
    border-bottom: 2px solid #1a73e8;
    font-weight: 600;
  }
  #area-tabs button .loading-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-left: 4px;
    border-radius: 50%;
    background: #f0ad4e;
    vertical-align: middle;
  }
  .area-panel { display: none; }
  .area-panel.active { display: block; }
  .area-panel .loading-note {
    padding: 6px 12px;
    color: #f0ad4e;
    font-size: 12px;
  }
</style>

const loadedAreas = new Set();

function ensureAreaLoaded(map, areaId, onDone) {
  if (loadedAreas.has(areaId)) { if (onDone) onDone(); return; }
  loadedAreas.add(areaId);
  const def = AREA_LAZY_DEFS[areaId];
  const sourceIds = Object.keys(def.sources);
  let pending = new Set(sourceIds);

  const checkDone = () => {
    if (pending.size === 0 && onDone) onDone();
  };
  if (sourceIds.length === 0) { checkDone(); return; }

  const onSourceData = (e) => {
    if (pending.has(e.sourceId) && e.isSourceLoaded) {
      pending.delete(e.sourceId);
      checkDone();
      if (pending.size === 0) map.off('sourcedata', onSourceData);
    }
  };
  map.on('sourcedata', onSourceData);

  sourceIds.forEach((sid) => {
    if (!map.getSource(sid)) map.addSource(sid, def.sources[sid]);
  });
  def.layers.forEach((layerDef) => {
    if (!map.getLayer(layerDef.id)) map.addLayer(layerDef);
  });
}

const map = new maplibregl.Map({
  container: 'map',
  style: 'style.json',
  center: [106.3504, 10.7874], // centroid bbox du lieu thuc te (Long An)
  zoom: 15,
  // Cho phep zoom sau de soi chi tiet du lieu do dac (den 21), nhung nguon
  // raster Esri chi khai bao maxzoom:18 trong style.json - MapLibre se tu
  // dong "overzoom" khi vuot qua, thay vi hien khoang trong/loi.
  maxZoom: 21,
  dragRotate: false,
  pitchWithRotate: false,
  touchPitch: false
});

map.on('load', () => {
  ICONS.forEach(([name, url]) => {
    map.loadImage(url, (err, image) => {
      if (err) { console.error('Khong load duoc icon', name, err); return; }
      if (!map.hasImage(name)) map.addImage(name, image, { pixelRatio: 2 });
    });
  });

  // --- panel ban do nen (radio, chon 1, dung chung cho ca 3 khu) ---
  const basemapListEl = document.getElementById('basemap-list');
  BASEMAPS.forEach((basemap, i) => {
    const id = 'basemap-toggle-' + i;
    const wrapper = document.createElement('label');
    wrapper.setAttribute('for', id);

    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'basemap';
    radio.id = id;
    radio.checked = basemap.id === 'none';
    radio.addEventListener('change', () => {
      if (!radio.checked) return;
      ALL_BASEMAP_LAYERS.forEach((layerId) => {
        if (map.getLayer(layerId)) {
          const visible = basemap.layers.includes(layerId);
          map.setLayoutProperty(layerId, 'visibility', visible ? 'visible' : 'none');
        }
      });
    });

    wrapper.appendChild(radio);
    wrapper.appendChild(document.createTextNode(basemap.label));
    basemapListEl.appendChild(wrapper);
  });

  // --- tab 3 khu, moi tab co danh sach checkbox lop rieng, doc lap nhau.
  // Du lieu cua 1 khu chi duoc tai (addSource/addLayer that su, sinh ra
  // request mang) dung luc tab cua no duoc mo lan dau - xem ensureAreaLoaded ---
  const areaIds = Object.keys(AREA_LAYER_GROUPS);
  const tabsEl = document.getElementById('area-tabs');
  const panelsEl = document.getElementById('area-panels');

  function setTabLoading(areaId, isLoading) {
    const dot = document.getElementById('loading-dot-' + areaId);
    const note = document.getElementById('loading-note-' + areaId);
    if (dot) dot.style.display = isLoading ? 'inline-block' : 'none';
    if (note) note.style.display = isLoading ? 'block' : 'none';
  }

  function activateArea(areaId, btn) {
    tabsEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    panelsEl.querySelectorAll('.area-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('area-panel-' + areaId).classList.add('active');

    if (!loadedAreas.has(areaId)) {
      setTabLoading(areaId, true);
      ensureAreaLoaded(map, areaId, () => setTabLoading(areaId, false));
    }
  }

  areaIds.forEach((areaId, idx) => {
    const btn = document.createElement('button');
    btn.className = idx === 0 ? 'active' : '';
    btn.appendChild(document.createTextNode(AREA_LABELS[areaId] || areaId));
    const dot = document.createElement('span');
    dot.className = 'loading-dot';
    dot.id = 'loading-dot-' + areaId;
    dot.style.display = 'none';
    dot.title = 'Đang tải dữ liệu khu này...';
    btn.appendChild(dot);
    btn.addEventListener('click', () => activateArea(areaId, btn));
    tabsEl.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'area-panel' + (idx === 0 ? ' active' : '');
    panel.id = 'area-panel-' + areaId;
    panel.setAttribute('data-area', areaId);

    const note = document.createElement('div');
    note.className = 'loading-note';
    note.id = 'loading-note-' + areaId;
    note.textContent = 'Đang tải dữ liệu khu ' + areaId + '...';
    note.style.display = 'none';
    panel.appendChild(note);

    const listEl = document.createElement('div');
    listEl.className = 'layer-list';

    AREA_LAYER_GROUPS[areaId].forEach((group, i) => {
      const id = 'layer-toggle-' + areaId + '-' + i;
      const wrapper = document.createElement('label');
      wrapper.setAttribute('for', id);

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.id = id;
      checkbox.checked = true;
      // Bat/tat chi anh huong cac style-layer cua RIENG khu nay - moi khu co
      // mot bo layer id rieng (vd "140-ranhKS-line" vs "160-ranhKS-line")
      // nen khong bao gio dung cham sang khu khac. Cac layer nay chi thuc
      // su ton tai tren map sau khi ensureAreaLoaded() cho khu do da chay
      // (luc tab duoc mo lan dau) - kiem tra map.getLayer() truoc khi set
      // de an toan neu checkbox bi bam truoc khi addLayer() kip xong.
      checkbox.addEventListener('change', () => {
        const visibility = checkbox.checked ? 'visible' : 'none';
        group.layers.forEach((layerId) => {
          if (map.getLayer(layerId)) {
            map.setLayoutProperty(layerId, 'visibility', visibility);
          }
        });
      });

      wrapper.appendChild(checkbox);
      wrapper.appendChild(document.createTextNode(group.label));
      listEl.appendChild(wrapper);
    });

    panel.appendChild(listEl);
    panelsEl.appendChild(panel);
  });

  // Tab dau tien (mac dinh active) duoc tai ngay - cac tab con lai chi tai
  // khi nguoi dung bam vao.
  setTabLoading(areaIds[0], true);
  ensureAreaLoaded(map, areaIds[0], () => setTabLoading(areaIds[0], false));
});

map.addControl(new maplibregl.NavigationControl({ showCompass: false }));
map.addControl(new maplibregl.AttributionControl({ compact: true }));
